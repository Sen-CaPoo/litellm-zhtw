# LiteLLM Proxy 設定範例 — Ollama Cloud
#
# 這是範例檔。複製成 config/config.yaml 後改成自己的模型與供應商設定:
#   cp config/config.example.yaml config/config.yaml
# config.yaml 本身已被 .gitignore 忽略,你的實際部署設定不會被提交。
#
# 模型名稱若之後 Ollama Cloud 有異動,調整 model 欄位後執行:docker compose restart litellm
#
# token 費用說明:
# 以下費率依 2026-07-17 查得的 OpenRouter 原廠端點或預設供應商價格設定。
# 單位皆為 USD per token（每百萬 token 單價 ÷ 1,000,000）。
# cache_read_input_token_cost 僅在來源提供獨立 Cache Read 價格時設定。
# 別名模型（如 gpt-5.6-sol）依其底層 model 欄位套用相同費率。

