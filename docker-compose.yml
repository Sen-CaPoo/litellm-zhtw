services:
  litellm:
    build:
      context: .
      args:
        LITELLM_UI_LANG: ${LITELLM_UI_LANG:-zh-TW}
    image: litellm-i18n:v1.99.1-${LITELLM_UI_LANG:-zh-TW}
    container_name: litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      STORE_MODEL_IN_DB: "True"
    volumes:
      - ./config/config.yaml:/app/config.yaml:ro
      # litellm_settings.callbacks 以 config 同目錄解析模組,必須掛在 /app 下
      - ./config/custom_callbacks.py:/app/custom_callbacks.py:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # LiteLLM 的協調快取:速率限制、預算、router cooldown 與快取失效的共用狀態。
  # 連線設定在 config/config.yaml 的 general_settings.coordination_redis。
  redis:
    image: redis:8-alpine
    container_name: litellm_redis
    restart: unless-stopped
    # 不 publish port — 只有同一個 compose 網路內的 litellm 連得到。
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD 未設定,請先在 .env 填入}
      - --appendonly
      - "yes"
      # 存的是計數與花費累計,被 evict 等於靜默算錯,所以寧可寫入失敗也不自行丟 key。
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    environment:
      # 供 healthcheck 的 redis-cli 取用,免得密碼出現在 process list
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    container_name: litellm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  postgres_data:
  redis_data:
